name: packages-verify

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "CHANGELOG.md"
      - ".github/actions/setup/**"
      - ".github/workflows/packages.verify.yml"
      - "scripts/**"
      - "packages/**"
  push:
    branches:
      - "main"
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "CHANGELOG.md"
      - ".github/actions/setup/**"
      - ".github/workflows/packages.verify.yml"
      - "scripts/**"
      - "packages/**"

permissions:
  contents: read

env:
  # verify:release parses each changelog entry's date literally, so it must
  # not depend on where a runner thinks it is.
  TZ: UTC

concurrency:
  group: packages-verify-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup workspace
        uses: ./.github/actions/setup

      - name: Release metadata
        run: pnpm verify:release

      - name: Build packages
        run: pnpm build

      # Packs the package, lints it with publint, then installs the tarball
      # into a throwaway consumer to check exports, the emitted declarations,
      # that no entry reaches another platform, and that a transition travels end
      # to end under plain node.
      - name: Packaged consumer
        run: pnpm test:package

      - name: Size budgets
        run: pnpm test:size

      - name: Upload verified packages
        uses: actions/upload-artifact@v4
        with:
          name: release
          path: .artifacts/release/
          if-no-files-found: error
          retention-days: 14
